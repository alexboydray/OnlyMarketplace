name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/om.jks"

      - name: Build release APK (signed with the permanent key so updates install over the top)
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/om.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk OnlyMarketplace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyMarketplace-apk
          path: OnlyMarketplace.apk

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }}"
          files: OnlyMarketplace.apk
          prerelease: true
